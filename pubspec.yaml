name: cleandrop
description: CleanDrop - On-Demand Laundry, Dry Cleaning & Blanket Care App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase Suite (Latest Stable)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1

  # Live GPS, Reverse Geocoding & OpenStreetMap
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Device Camera, Phone Dialer, PDF Tax Invoice & Push Notifications
  image_picker: ^1.2.4
  intl: ^0.20.3
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_local_notifications: ^23.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true